[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dronevision"
version = "0.2.0"
description = "Local drone video georeferencing and mosaicking"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "opencv-python>=4.9", "pyproj>=3.6"]

[project.optional-dependencies]
science = ["matplotlib>=3.8", "netCDF4>=1.6", "scipy>=1.12", "tqdm>=4.66"]

[project.scripts]
dronevision = "dronevision.__main__:main"

[tool.setuptools.package-data]
dronevision = ["web_static/*"]

[tool.setuptools.packages.find]
include = ["dronevision*"]
